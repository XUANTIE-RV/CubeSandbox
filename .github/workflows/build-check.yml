name: Build Check

on:
  push:
    branches: [master]
    paths:
      - 'CubeAPI/**'
      - 'CubeMaster/**'
      - 'CubeTemplateCenter/**'
      - 'CubeOps/**'
      - 'pkgs/cubedb/**'
      - 'pkgs/blobstore/**'
      - 'pkgs/CubeLog/**'
      - 'pkgs/proto/**'
      - 'Cubelet/**'
      - 'CubeNet/**'
      - 'CubeShim/**'
      - 'third_party/containerd-shim/**'
      - 'hypervisor/**'
      - 'agent/**'
      - 'guest-init/**'
      - 'cubecow/**'
      - 'examples/volume/s3/**'
      - 'docker/Dockerfile.builder'
      - '.github/workflows/build-builder-image.yml'
      - '.github/workflows/build-check.yml'
      - 'Makefile'
      - 'configs/kernel-oc9.riscv64.config'
      - 'scripts/build-kernel.sh'
      - 'CubeNet/vmlinux/riscv64/**'
      - 'CubeS3lvol/setup_dep.sh'
      - 'deploy/scripts/docker-install-volume-deps.sh'
      - 'cube-lifecycle-manager/**'
  pull_request:
    paths:
      - 'CubeAPI/**'
      - 'CubeMaster/**'
      - 'CubeTemplateCenter/**'
      - 'CubeOps/**'
      - 'pkgs/cubedb/**'
      - 'pkgs/blobstore/**'
      - 'pkgs/CubeLog/**'
      - 'pkgs/proto/**'
      - 'Cubelet/**'
      - 'CubeNet/**'
      - 'CubeShim/**'
      - 'third_party/containerd-shim/**'
      - 'hypervisor/**'
      - 'agent/**'
      - 'guest-init/**'
      - 'cubecow/**'
      - 'examples/volume/s3/**'
      - 'docker/Dockerfile.builder'
      - '.github/workflows/build-builder-image.yml'
      - '.github/workflows/build-check.yml'
      - 'Makefile'
      - 'configs/kernel-oc9.riscv64.config'
      - 'scripts/build-kernel.sh'
      - 'CubeNet/vmlinux/riscv64/**'
      - 'CubeS3lvol/setup_dep.sh'
      - 'deploy/scripts/docker-install-volume-deps.sh'
      - 'cube-lifecycle-manager/**'
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILDER_IMAGE_REMOTE: ghcr.io/tencentcloud/cubesandbox-builder:ubuntu2004
  BUILDER_IMAGE_LOCAL: cube-sandbox-builder:ci
  # riscv64 cross builder (ENABLE_RISCV64_CROSS=1). build-riscv64 COLD-BUILDS it by
  # default -- self-contained: the musl.cc cross toolchain and the static
  # libseccomp/libcap-ng (riscv64-musl) are compiled inside docker/Dockerfile.builder,
  # so no published image is needed. Once publish-riscv64-builder.yml has pushed
  # BUILDER_IMAGE_RISCV64_REMOTE and it is public, set the repo variable
  # RISCV64_BUILDER_PULL_FIRST=true to pull it instead of cold-building.
  BUILDER_IMAGE_RISCV64_REMOTE: ghcr.io/xuantie-rv/cubesandbox-builder:riscv64-cross
  BUILDER_IMAGE_RISCV64_LOCAL: cube-sandbox-builder:riscv64-cross

jobs:
  build:
    name: Build ${{ matrix.component }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Build every component on both amd64 and arm64. The two axes are
        # crossed automatically; the per-arch `include` entries attach the
        # runner label, and the per-component `include` entries attach the
        # make target + expected binaries. Architecture coverage catches
        # arch-specific regressions (e.g. cfg(target_arch) code in the shim /
        # hypervisor) that an amd64-only build would miss.
        component: [CubeAPI, CubeOps, CubeMaster, CubeTemplateCenter, Cubelet, agent, CubeShim, volume-s3]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: CubeAPI
            make_target: cubeapi
            expected_bins: |
              _output/bin/cube-api
          - component: CubeOps
            make_target: cubeops
            expected_bins: |
              _output/bin/cubeops
              _output/bin/cubeopscli
          - component: CubeMaster
            make_target: cubemaster
            expected_bins: |
              _output/bin/cubemaster
              _output/bin/cubemastercli
          - component: CubeTemplateCenter
            make_target: cubetemplatecenter
            expected_bins: |
              _output/bin/templatecenter
          - component: Cubelet
            make_target: cubelet
            expected_bins: |
              _output/bin/cubelet
              _output/bin/cubecli
          - component: agent
            make_target: agent
            expected_bins: |
              _output/bin/cube-agent
          - component: CubeShim
            make_target: shim
            expected_bins: |
              _output/bin/containerd-shim-cube-rs
              _output/bin/cube-runtime
          # S3 Volume plugin (examples/volume/s3): its own Go module, so it is
          # not covered by any component build above.
          - component: volume-s3
            make_target: cube-volume-s3
            expected_bins: |
              _output/bin/cube-volume-s3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect builder changes
        id: builder_changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${GITHUB_SHA}"
          fi

          if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${head_ref}")"
          else
            changed_files="$(git diff --name-only "${base_ref}" "${head_ref}")"
          fi

          printf 'Changed files:\n%s\n' "${changed_files}"

          builder_inputs_changed="false"
          while IFS= read -r file; do
            case "${file}" in
              docker/Dockerfile.builder|.github/workflows/build-builder-image.yml)
                builder_inputs_changed="true"
                break
                ;;
            esac
          done <<< "${changed_files}"

          echo "changed=${builder_inputs_changed}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        id: ghcr_login
        if: steps.builder_changes.outputs.changed != 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn about GHCR login failure
        if: steps.ghcr_login.outcome == 'failure'
        shell: bash
        run: echo "::warning::GHCR login failed - will attempt pull as anonymous or build locally"

      - name: Resolve builder image
        id: builder_image
        shell: bash
        run: |
          set -euo pipefail

          build_local_builder_image() {
            docker build \
              -t "${BUILDER_IMAGE_LOCAL}" \
              -f docker/Dockerfile.builder \
              --build-arg GITHUB_ACTIONS=true \
              --build-arg RUSTUP_DIST_SERVER=https://static.rust-lang.org \
              --build-arg RUSTUP_UPDATE_ROOT=https://static.rust-lang.org/rustup \
              .
          }

          image="${BUILDER_IMAGE_REMOTE}"

          if [[ "${{ steps.builder_changes.outputs.changed }}" == "true" ]]; then
            echo "Builder inputs changed, building local builder image..."
            build_local_builder_image
            image="${BUILDER_IMAGE_LOCAL}"
          elif docker pull "${BUILDER_IMAGE_REMOTE}"; then
            echo "Using published builder image ${BUILDER_IMAGE_REMOTE}"
          else
            echo "Failed to pull ${BUILDER_IMAGE_REMOTE}, building local fallback image..."
            build_local_builder_image
            image="${BUILDER_IMAGE_LOCAL}"
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Build ${{ matrix.component }}
        shell: bash
        env:
          MAKE_TARGET: ${{ matrix.make_target }}
          EXPECTED_BINS: ${{ matrix.expected_bins }}
        run: |
          set -euo pipefail

          echo "Component: ${{ matrix.component }}"
          echo "Builder image: ${{ steps.builder_image.outputs.image }}"

          make "${MAKE_TARGET}" \
            BUILDER_IMAGE="${{ steps.builder_image.outputs.image }}"

          while IFS= read -r binary; do
            [[ -n "${binary}" ]] || continue
            if ! test -x "${binary}"; then
              echo "::error::Expected binary not found or not executable: ${binary}"
              exit 1
            fi
          done <<< "${EXPECTED_BINS}"

  build-riscv64:
    name: Cross-build RISC-V binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect builder input changes
        id: builder_changes
        run: |
          set -euo pipefail
          # Rebuild (never pull a stale image) when the builder recipe or either
          # builder-image workflow changed in this PR/push.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${GITHUB_SHA}"
          fi
          if [[ -z "${base_ref}" || "${base_ref}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${head_ref}")"
          else
            changed_files="$(git diff --name-only "${base_ref}" "${head_ref}")"
          fi
          changed=false
          while IFS= read -r f; do
            case "${f}" in
              docker/Dockerfile.builder \
              |.github/workflows/build-builder-image.yml \
              |.github/workflows/publish-riscv64-builder.yml)
                changed=true; break ;;
            esac
          done <<< "${changed_files}"
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Prepare RISC-V cross builder (cold-build by default)
        env:
          PULL_FIRST: ${{ vars.RISCV64_BUILDER_PULL_FIRST }}
          # Optional mirror for the riscv64 musl cross toolchain tarball
          # (docker/Dockerfile.builder ARG RISCV64_MUSL_CROSS_URL). musl.cc is
          # intermittently unreachable from GitHub-hosted runners; a fork can
          # set the CUBE_RISCV64_MUSL_CROSS_URL repo variable to a mirror (the
          # Dockerfile sha256 pin still applies). Empty -> Dockerfile default.
          MUSL_URL: ${{ vars.CUBE_RISCV64_MUSL_CROSS_URL }}
        run: |
          set -euo pipefail
          # DEFAULT = self-contained cold build. `docker build` with
          # ENABLE_RISCV64_CROSS=1 downloads the musl.cc riscv64 cross toolchain and
          # cross-compiles the static libseccomp + libcap-ng (riscv64-musl) INSIDE the
          # builder image (docker/Dockerfile.builder L262-307). No published GHCR image
          # is required, so CI works out of the box.
          build_local() {
            docker build \
              --build-arg GITHUB_ACTIONS=true \
              --build-arg ENABLE_RISCV64_CROSS=1 \
              --build-arg BUILD_S3LVOL_DEPS=0 \
              --build-arg RUSTUP_DIST_SERVER=https://static.rust-lang.org \
              --build-arg RUSTUP_UPDATE_ROOT=https://static.rust-lang.org/rustup \
              ${MUSL_URL:+--build-arg RISCV64_MUSL_CROSS_URL=${MUSL_URL}} \
              -t "${BUILDER_IMAGE_RISCV64_LOCAL}" \
              -f docker/Dockerfile.builder .
          }
          # OPTIONAL fast path: once ghcr.io/xuantie-rv/cubesandbox-builder:riscv64-cross
          # is published AND public (see publish-riscv64-builder.yml), set the repo
          # variable RISCV64_BUILDER_PULL_FIRST=true to pull it instead of cold-building.
          # Always cold-build when the builder recipe itself changed in this PR/push.
          changed="${{ steps.builder_changes.outputs.changed }}"
          if [[ "${PULL_FIRST}" == "true" && "${changed}" != "true" ]] \
             && docker pull "${BUILDER_IMAGE_RISCV64_REMOTE}"; then
            echo "using published ${BUILDER_IMAGE_RISCV64_REMOTE}"
            docker tag "${BUILDER_IMAGE_RISCV64_REMOTE}" "${BUILDER_IMAGE_RISCV64_LOCAL}"
          else
            echo "cold-building riscv64-cross builder image (musl toolchain + libseccomp/libcap-ng)"
            build_local
          fi

      - name: Cross-build RISC-V components
        run: make all-riscv64 RISCV64_BUILDER_IMAGE=cube-sandbox-builder:riscv64-cross SKIP_BUILDER_IMAGE_CHECK=1

      - name: Verify RISC-V ELF outputs
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r binary; do
            [[ -n "${binary}" ]] || continue
            test -s "${binary}"
            test -x "${binary}"
            readelf -h "${binary}" | grep -q 'Class:.*ELF64'
            readelf -h "${binary}" | grep -q 'Data:.*little endian'
            readelf -h "${binary}" | grep -q 'Machine:.*RISC-V'
          done <<'EOF'
          _output/bin/cube-agent-riscv64
          _output/bin/cube-init-riscv64
          _output/bin/cube-volume-s3-riscv64
          _output/bin/cube-lifecycle-manager-riscv64
          _output/bin/cube-api-riscv64
          _output/bin/cubelet-riscv64
          _output/bin/cubecli-riscv64
          _output/bin/cubemaster-riscv64
          _output/bin/cubemastercli-riscv64
          _output/bin/templatecenter-riscv64
          _output/bin/cubeops-riscv64
          _output/bin/cubeopscli-riscv64
          _output/bin/cubevsmapdump-riscv64
          _output/bin/containerd-shim-cube-rs-riscv64
          _output/bin/cube-runtime-riscv64
          EOF

          archive=_output/bin/libcubecow-riscv64.a
          test -s "${archive}"
          archive_dir="$(mktemp -d)"
          trap 'rm -rf "${archive_dir}"' EXIT
          (
            cd "${archive_dir}"
            ar x "${GITHUB_WORKSPACE}/${archive}"
            member_count=0
            for member in *; do
              [[ -f "${member}" ]] || continue
              member_count=$((member_count + 1))
              readelf -h "${member}" | grep -q 'Class:.*ELF64'
              readelf -h "${member}" | grep -q 'Data:.*little endian'
              readelf -h "${member}" | grep -q 'Machine:.*RISC-V'
            done
            test "${member_count}" -gt 0
          )

      - name: Upload RISC-V binaries for the qemu-user smoke job
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-binaries
          path: _output/bin/*-riscv64
          if-no-files-found: error
          retention-days: 1

  # Runtime smoke: actually EXECUTE each cross-built riscv64 binary under
  # qemu-user. They are fully static musl ELFs (Makefile *-riscv64 targets pass
  # CUBE_STATIC=1 / -Ctarget-feature=+crt-static), so no guest rootfs is needed.
  # The amd64/arm64 `build` job only checks `test -x`; this goes further and
  # confirms each binary loads and starts without a fatal signal -- which is what
  # catches e.g. the riscv64 fat-LTO miscompile that made cube-api SIGSEGV at
  # NULL on the first request (see the Makefile cubeapi-riscv64 LTO=false note).
  # Deep runtime behaviour (serving a request, vAIA snapshot/restore) needs a
  # riscv64 KVM host -- see riscv64-snapshot-integration.yml (self-hosted, gated).
  smoke-riscv64:
    name: RISC-V qemu-user smoke
    needs: build-riscv64
    runs-on: ubuntu-latest
    steps:
      - name: Download RISC-V binaries
        uses: actions/download-artifact@v4
        with:
          name: riscv64-binaries
          path: riscv64-bin

      - name: Install qemu-user-static
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          qemu-riscv64-static --version | head -1

      - name: Execute each riscv64 binary under qemu-user
        run: |
          set -uo pipefail
          cd riscv64-bin
          chmod +x ./*-riscv64 2>/dev/null || true
          fail=0
          for bin in *-riscv64; do
            [[ -f "${bin}" ]] || continue
            # A binary passes if ANY invocation form exits without a fatal
            # signal. Fatal signals: SIGSEGV=139, SIGILL=132, SIGABRT=134,
            # SIGBUS=135. A clean exit, a usage error (1/2), or a timeout (124)
            # all mean the ELF loaded and started executing correctly.
            ok=0
            for args in "--version" "--help" ""; do
              # EVERY form is timeout-wrapped: some binaries ignore --version/
              # --help and block (e.g. cube-lifecycle-manager starts a service),
              # which would otherwise hang the step forever. A timeout (124) is
              # treated as OK below -- the ELF loaded and started executing.
              if [[ -n "${args}" ]]; then
                timeout 15s qemu-riscv64-static "./${bin}" ${args} >/dev/null 2>&1; rc=$?
              else
                timeout 10s qemu-riscv64-static "./${bin}" >/dev/null 2>&1; rc=$?
              fi
              case "${rc}" in
                139|132|134|135) ;;  # fatal signal -> try the next form
                *) ok=1; echo "  OK    ${bin}: exit ${rc} (args '${args}')"; break ;;
              esac
            done
            if [[ "${ok}" -ne 1 ]]; then
              echo "  FAIL  ${bin}: fatal signal on --version/--help/no-arg (last rc=${rc})"
              fail=1
            fi
          done
          if [[ "${fail}" -ne 0 ]]; then
            echo "::error::one or more riscv64 binaries crashed under qemu-user (see FAIL lines)"
            exit 1
          fi
          echo "All riscv64 binaries executed under qemu-user without a fatal signal."

  # Docker smoke build for release images that use repo-root context +
  # adjacent Dockerfile.dockerignore (catches context/ignore regressions).
  docker-smoke:
    name: Docker Smoke Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CubeMaster image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CubeMaster/docker/Dockerfile
          push: false
          load: false

      - name: Build cubemastercli image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CubeMaster/docker/Dockerfile.cubemastercli
          push: false
          load: false

      - name: Build cube-templatecenter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CubeTemplateCenter/docker/Dockerfile
          push: false
          load: false

      - name: Build cubelet image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Cubelet/Dockerfile
          push: false
          load: false

      - name: Build cube-shim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CubeShim/Dockerfile
          push: false
          load: false

      - name: Build CubeOps image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CubeOps/Dockerfile
          push: false
          load: false
