name: RISC-V Snapshot Integration

# riscv64 microVM boot + vAIA snapshot/restore -- the counterpart of the x86-64
# hypervisor-integration.yaml (dev_cli.sh tests --integration --quick, which
# covers test_direct_kernel_boot / test_snapshot_restore_basic on GH's x86 KVM).
#
# Backend = C1 (plan 件 4, confirmed): a GitHub-hosted x86 runner + an in-job
# QEMU/TCG L1 (riscv64, -cpu max with the H-extension + AIA aplic-imsic). The L1
# kernel (7.2, CONFIG_KVM=y) gets /dev/kvm from QEMU's emulated H-extension, so
# cube-runtime / Cube-Hypervisor running INSIDE the L1 boot an L2 microVM over
# nested KVM and exercise vAIA snapshot/restore -- no self-hosted riscv64
# hardware and no host KVM required. Everything is TCG-emulated, hence slow; the
# timeout is generous. The L1 orchestration lives in
# hypervisor/scripts/run_c1_nested_riscv64.sh (the CI codification of the
# hand-validated cube-72-snap-bed testbed).
#
# ALIGNED ENVIRONMENT (all three legs pinned to upstream/community sources):
#   kernel : kernel.org v7.2 + configs/patches/{riscv64-dax-zeropage-folio,
#            riscv64-kvm-zeropage-dirtylog}, built IN-PLACE by
#            build_guest_kernel_riscv64.sh (same two patches as yocto
#            linux-xuantie_7.2.bb). The build output (${WORKLOADS_DIR}/Image) is
#            actions/cache'd with a key that hashes the kernel config, BOTH
#            patches, and both build scripts -- any change to those inputs
#            forces a from-source rebuild, which keeps the hard requirement
#            enforceable by cache-key rather than by recompiling every run:
#            without the KVM dirty-log backport the KVM dirty-log fast path
#            lets the L2 write through a read-only ZERO_PAGE G-stage leaf into
#            the L1's empty_zero_page at -smp>1, corrupting every fresh anon
#            page in the L1 (Go "arena already initialized" / awk segfault).
#            Deliberately NO restore-keys: a prefix-matched stale Image built
#            from different patches is exactly what must never boot.
#            RISCV64_L1_SMP defaults to 4.
#   qemu   : community 11.x, built from the qemu.org source release by
#            build_qemu_riscv64.sh (actions/cache'd). The distro qemu is NOT
#            usable: ubuntu-24.04's apt qemu 8.2.2 has broken TCG IMSIC/AIA --
#            inside the L1 the 7.2 kernel never completes kvm_riscv_aia_init()
#            ("AIA available" never prints), /dev/kvm reports KVM_CAP_IRQCHIP=0,
#            and the shim panics at check_required_extensions.
#   opensbi: community v1.7 release fw_dynamic.bin, wget'd by
#            fetch_guest_assets_riscv64.sh (together with the Ubuntu rootfs).
#            Both outputs are actions/cache'd; the rootfs key embeds the
#            (overridable) CUBE_RISCV64_ROOTFS_URL so pinning a different
#            image busts the cache. The default noble 'current' URL is a
#            moving target, so a warm cache intentionally pins whatever noble
#            build was fetched on the cold run until the key version is bumped.
# No 件 0 Release asset and no CUBE_RISCV64_ASSET_BASE variable are required.

on:
  pull_request:
    paths:
      - 'hypervisor/**'
      - 'CubeShim/**'
      - 'agent/**'
      - 'guest-init/**'
      - 'configs/kernel-oc9.riscv64.config'
      - 'configs/patches/**'
      - 'scripts/build-kernel.sh'
      - 'deploy/one-click/build-guest-image-riscv64.sh'
      - 'deploy/one-click/build-agent-ext4.sh'
      - '.github/workflows/riscv64-snapshot-integration.yml'
  workflow_dispatch:

concurrency:
  group: riscv64-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKLOADS_DIR: ${{ github.workspace }}/workloads
  QEMU_VERSION: '11.1.1'

jobs:
  snapshot-restore-c1:
    name: riscv64 C1 nested-TCG boot + vAIA snapshot/restore
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install guest tooling + riscv64 kernel cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          # qemu-system-riscv64 deliberately NOT installed from apt: noble ships
          # qemu 8.2.2 whose TCG IMSIC/AIA is broken for the nested L1 (see the
          # header). The community qemu 11 used for the L1 is built from source
          # by build_qemu_riscv64.sh below. Here: qemu-utils for qemu-img;
          # cloud-image-utils for cloud-localds (NoCloud seed); mtools as a
          # seed fallback; e2fsprogs for the guest-image/agent ext4 builders.
          # gcc-riscv64-linux-gnu + the kernel build deps cross-compile the 7.2
          # guest Image in-place (build_guest_kernel_riscv64.sh -> build-kernel.sh).
          sudo apt-get install -y \
            qemu-utils cloud-image-utils mtools e2fsprogs \
            openssh-client btrfs-progs \
            gcc-riscv64-linux-gnu build-essential bc bison flex libelf-dev \
            libssl-dev libncurses-dev dwarves cpio kmod rsync xz-utils patch
          riscv64-linux-gnu-gcc --version | head -1

      - name: Cache community QEMU ${{ env.QEMU_VERSION }} build
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKLOADS_DIR }}/qemu-install
          key: qemu-${{ env.QEMU_VERSION }}-riscv64-softmmu-1

      - name: Build community QEMU ${{ env.QEMU_VERSION }} (qemu-system-riscv64 only)
        run: |
          set -euo pipefail
          chmod +x hypervisor/scripts/build_qemu_riscv64.sh
          # -> ${WORKLOADS_DIR}/qemu-install/bin/qemu-system-riscv64.
          # Idempotent: a cache hit on qemu-install skips the build entirely.
          hypervisor/scripts/build_qemu_riscv64.sh

      - name: Build riscv64 components
        env:
          # Optional mirror for the riscv64 musl cross toolchain tarball
          # (docker/Dockerfile.builder ARG RISCV64_MUSL_CROSS_URL). musl.cc is
          # intermittently unreachable from GitHub-hosted runners; a fork can
          # set the CUBE_RISCV64_MUSL_CROSS_URL repo variable to a mirror (the
          # Dockerfile sha256 pin still applies). Empty -> Dockerfile default.
          RISCV64_MUSL_CROSS_URL: ${{ vars.CUBE_RISCV64_MUSL_CROSS_URL }}
        run: |
          set -euo pipefail
          # Produces _output/bin/*-riscv64 (cube-runtime, containerd-shim-cube-rs,
          # cube-agent, cube-init, ...). SKIP_BUILDER_IMAGE_CHECK lets a runner
          # with a prebuilt builder image reuse it.
          make all-riscv64 SKIP_BUILDER_IMAGE_CHECK=1 || make all-riscv64
          # l2pause: the L2 container entrypoint baked into the guest image below
          # (cube-spec args /usr/bin/l2pause; the cube-min.tar layer is empty).
          make l2pause-riscv64 SKIP_BUILDER_IMAGE_CHECK=1 || make l2pause-riscv64

      - name: Cache 7.2 guest kernel Image
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: ${{ env.WORKLOADS_DIR }}/Image
          # The key hashes every input that can change the Image: config, both
          # out-of-tree patches, and both build scripts. No restore-keys -- a
          # prefix-matched stale kernel would silently drop a patch change.
          key: kernel-7.2-riscv64-v1-${{ hashFiles('configs/kernel-oc9.riscv64.config', 'configs/patches/riscv64-dax-zeropage-folio.patch', 'configs/patches/riscv64-kvm-zeropage-dirtylog.patch', 'scripts/build-kernel.sh', 'hypervisor/scripts/build_guest_kernel_riscv64.sh') }}

      - name: Build 7.2 guest kernel Image (in-place, cross-compiled)
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          chmod +x hypervisor/scripts/build_guest_kernel_riscv64.sh
          # -> ${WORKLOADS_DIR}/Image (PE/EFI-stub, CONFIG_KVM=y, both patches applied).
          # Serves BOTH the C1 L1 host kernel (qemu -kernel, needs /dev/kvm) and the
          # L2 guest kernel. WORKLOADS_DIR is inherited from the workflow env.
          hypervisor/scripts/build_guest_kernel_riscv64.sh

      - name: Cache riscv64 guest assets (opensbi fw + Ubuntu rootfs raw)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKLOADS_DIR }}/fw_dynamic.bin
            ${{ env.WORKLOADS_DIR }}/ubuntu-riscv64.raw
          # fetch_guest_assets_riscv64.sh skips download+convert when both files
          # exist, so a hit makes the fetch step a no-op. The key embeds the
          # rootfs URL var: overriding CUBE_RISCV64_ROOTFS_URL busts the cache.
          key: guest-assets-riscv64-v1-${{ vars.CUBE_RISCV64_ROOTFS_URL || 'noble-current' }}

      - name: Fetch riscv64 guest assets (opensbi + rootfs)
        env:
          CUBE_RISCV64_ROOTFS_URL: ${{ vars.CUBE_RISCV64_ROOTFS_URL }}
        run: |
          set -euo pipefail
          mkdir -p "${WORKLOADS_DIR}"
          chmod +x hypervisor/scripts/fetch_guest_assets_riscv64.sh
          # -> ${WORKLOADS_DIR}/{fw_dynamic.bin,ubuntu-riscv64.raw}
          hypervisor/scripts/fetch_guest_assets_riscv64.sh

      - name: Build L2 guest OS image (pmem0) + cube-agent ext4 (pmem1)
        run: |
          set -euo pipefail
          chmod +x deploy/one-click/build-guest-image-riscv64.sh deploy/one-click/build-agent-ext4.sh
          # cube-guest-image-cpu.img: the L2 guest rootfs (/sbin/init = cube-init).
          # ONE_CLICK_L2PAUSE_BIN bakes /usr/bin/l2pause into /cube-root (the
          # integration's container entrypoint).
          OUTPUT_DIR="${WORKLOADS_DIR}" \
            ONE_CLICK_CUBE_INIT_BIN="${GITHUB_WORKSPACE}/_output/bin/cube-init-riscv64" \
            ONE_CLICK_L2PAUSE_BIN="${GITHUB_WORKSPACE}/_output/bin/l2pause-riscv64" \
            ./deploy/one-click/build-guest-image-riscv64.sh
          # cube-agent.ext4: the cube-agent pmem1 payload.
          OUTPUT_DIR="${WORKLOADS_DIR}" \
            ONE_CLICK_CUBE_AGENT_BIN="${GITHUB_WORKSPACE}/_output/bin/cube-agent-riscv64" \
            ./deploy/one-click/build-agent-ext4.sh
          ls -la "${WORKLOADS_DIR}"/cube-guest-image-cpu.img "${WORKLOADS_DIR}"/cube-agent.ext4

      - name: Generate cube snapshot assets (spec + min.tar)
        run: |
          set -euo pipefail
          chmod +x hypervisor/scripts/gen_cube_snapshot_assets_riscv64.sh
          # -> ${WORKLOADS_DIR}/{cube-spec.json,cube-spec-restore.json,cube-min.tar}
          OUTPUT_DIR="${WORKLOADS_DIR}" CUBE_ARCH=riscv64 \
            hypervisor/scripts/gen_cube_snapshot_assets_riscv64.sh

      - name: Run C1 nested snapshot/restore (boot L1 under QEMU TCG, test inside)
        env:
          BIN_DIR: ${{ github.workspace }}/_output/bin
          L1_SMP: ${{ vars.RISCV64_L1_SMP || '4' }}
          L1_MEM: ${{ vars.RISCV64_L1_MEM || '4G' }}
          RUNDIR: ${{ runner.temp }}/c1-l1
          # The community qemu 11 built above -- NOT the distro qemu (8.2.2's
          # broken TCG IMSIC/AIA would panic the shim at check_required_extensions).
          QEMU: ${{ env.WORKLOADS_DIR }}/qemu-install/bin/qemu-system-riscv64
        run: |
          set -euo pipefail
          chmod +x hypervisor/scripts/run_c1_nested_riscv64.sh \
                   hypervisor/scripts/run_integration_tests_riscv64.sh
          hypervisor/scripts/run_c1_nested_riscv64.sh

      - name: Upload L1 / L2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-c1-snapshot-logs
          path: |
            ${{ runner.temp }}/c1-l1/serial.log
            ${{ runner.temp }}/c1-l1/integration.log
            ${{ runner.temp }}/c1-l1/qemu-guest-errors.log
          if-no-files-found: ignore
          retention-days: 7

  # Examples sanity gate: every examples/**/*.py must byte-compile, the no-LLM
  # demo's deps must install from PyPI, and its CLI contract (usage / missing-env
  # preflight) must hold. Catches example bit-rot at PR time WITHOUT a cluster.
  examples-sanity:
    name: Examples sanity (no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Byte-compile all examples (full file list, full output)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import py_compile, pathlib, sys
          files = sorted(pathlib.Path("examples").rglob("*.py"))
          print(f"py_compile targets ({len(files)} files):")
          bad = 0
          for f in files:
              try:
                  py_compile.compile(str(f), doraise=True)
                  print(f"  OK   {f}")
              except py_compile.PyCompileError as e:
                  bad += 1
                  print(f"  FAIL {f}: {e}")
          if bad:
              print(f"RESULT: {bad}/{len(files)} files failed to compile")
              sys.exit(1)
          print(f"RESULT: {len(files)} files checked, ALL OK")
          EOF

      - name: Install demo deps (cubesandbox SDK + python-dotenv)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/demo-venv
          /tmp/demo-venv/bin/pip install "cubesandbox>=0.2.0" python-dotenv

      - name: Smoke coldstart_snapshot_demo.py CLI contract
        run: |
          set -uo pipefail  # NOT -e: the no-env run MUST exit non-zero; assert explicitly
          DEMO=examples/openai-agents-code-interpreter/coldstart_snapshot_demo.py
          echo "=== smoke 1: no environment -> preflight must fail with a clear reason ==="
          set +e
          out=$(/tmp/demo-venv/bin/python "${DEMO}" 2>&1)
          rc=$?
          set -e
          echo "${out}"
          echo "exit code: ${rc}"
          if [[ ${rc} -ne 2 ]] || ! grep -q "PREFLIGHT FAIL: CUBE_TEMPLATE_ID is unset" <<<"${out}"; then
            echo "FAIL: expected rc=2 with the CUBE_TEMPLATE_ID preflight message"
            exit 1
          fi
          echo "smoke 1: PASS (preflight fails fast with the expected message)"
          echo "=== smoke 2: --help -> usage, rc=0 ==="
          /tmp/demo-venv/bin/python "${DEMO}" --help
          echo "smoke 2: PASS"
          echo "EXAMPLES-SANITY: PASS"
