name: Deploy Script Check

# PR gate for the deploy shell scripts. The riscv64 port touched deploy/one-click
# (arch normalization, H-extension detection, native MySQL/Redis, install paths)
# but no existing PR workflow lints deploy/**/*.sh -- terraform-validate only
# covers deploy/one-click/terraform/**. This adds a fast bash -n + shellcheck
# gate over ONLY the .sh files a PR changes (the repo has ~295 .sh; linting all
# would be slow and drown in pre-existing style noise).

on:
  pull_request:
    paths:
      - 'deploy/**/*.sh'
      - '.github/workflows/deploy-script-check.yml'
  workflow_dispatch:

concurrency:
  group: deploy-script-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck changed deploy scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint changed deploy/*.sh
        env:
          # Pass event SHAs through the environment, never interpolated straight
          # into the shell, so a crafted ref/PR field cannot inject commands.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          if [[ -n "${BASE_SHA}" && "${BASE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            range="${BEFORE_SHA}..${GITHUB_SHA}"
          else
            # workflow_dispatch has no event SHAs. Scope to what this branch
            # changed relative to the default branch (the PR intent); fall back
            # to whole-file lint of every tracked deploy script only when the
            # merge-base cannot be obtained.
            git fetch --no-tags origin "${DEFAULT_BRANCH}" >/dev/null 2>&1 || true
            base="$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null || true)"
            if [[ -n "${base}" ]]; then
              range="${base}..${GITHUB_SHA}"
              echo "workflow_dispatch: scoping to changes vs ${DEFAULT_BRANCH} merge-base ${base}"
            else
              range=""
            fi
          fi

          if [[ -z "${range}" ]]; then
            echo "No diff range available (first push?); linting all tracked deploy/**/*.sh"
            mapfile -t files < <(git ls-files 'deploy/**/*.sh')
          else
            mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${range}" -- 'deploy/**/*.sh')
          fi

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No deploy/**/*.sh changed -- nothing to lint."
            exit 0
          fi

          printf 'Changed deploy scripts (%d):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          fail=0
          for f in "${files[@]}"; do
            [[ -f "${f}" ]] || continue
            echo "=== bash -n ${f} ==="
            if ! bash -n "${f}"; then
              echo "::error file=${f}::bash syntax error"; fail=1
            fi
            echo "=== shellcheck ${f} (gating only lines this PR changed) ==="
            # NB: shellcheck lints the WHOLE file, so a PR that merely touches
            # one line of a large script would otherwise fail on that file's
            # PRE-EXISTING warnings. Scope the gate to the line numbers this PR
            # added/changed (derived from the same range used to select files).
            # -S warning keeps only warning/error severity. On a first push (no
            # range) there is no diff to scope to, so lint the whole file.
            declare -A changed=()
            if [[ -n "${range}" ]]; then
              while IFS= read -r ln; do
                [[ -n "${ln}" ]] && changed["${ln}"]=1
              done < <(git diff -U0 "${range}" -- "${f}" | awk '
                /^@@/ { if (match($0, /\+[0-9]+(,[0-9]+)?/)) {
                          s=substr($0, RSTART+1, RLENGTH-1); split(s, a, ",");
                          st=a[1]+0; n=(a[2]==""?1:a[2]+0);
                          for (i=0;i<n;i++) print st+i } }')
            fi
            gated=0
            while IFS= read -r finding; do
              [[ -n "${finding}" ]] || continue
              rest="${finding#*:}"; ln="${rest%%:*}"
              if [[ -z "${range}" || -n "${changed[${ln}]:-}" ]]; then
                echo "${finding}"; gated=1
              fi
            done < <(shellcheck -S warning -f gcc "${f}" 2>/dev/null)
            if [[ "${gated}" -ne 0 ]]; then
              echo "::error file=${f}::shellcheck warning+ on lines changed by this PR"; fail=1
            else
              echo "  no shellcheck warning+ on PR-changed lines (pre-existing warnings not gated)"
            fi
            unset changed
          done

          if [[ "${fail}" -ne 0 ]]; then
            echo "::error::deploy script lint failed (see above)"
            exit 1
          fi
          echo "All changed deploy scripts passed bash -n + shellcheck."
