name: RISC-V Guest Assets Check

# Downloads the riscv64 guest assets that HAVE official public prebuilts (OpenSBI
# 1.7 fw_dynamic, Ubuntu riscv64 rootfs) using the same wget-from-public-source
# mechanism the x86-64 integration tests use, then verifies they are fetchable,
# intact, and assembleable (qemu-img-recognized rootfs).
#
# The Linux 7.2 guest kernel Image is NOT fetched here -- kernel.org ships source
# only (no prebuilt riscv64 Image), so it is built IN-PLACE by
# riscv64-snapshot-integration.yml (件 4) via build_guest_kernel_riscv64.sh. This
# job deliberately stays a fast download/assemble check (no kernel cross-build).
#
# This is a pure download/assemble check -- no KVM, no boot, no kernel build.
# Booting + vAIA snapshot/restore lives in riscv64-snapshot-integration.yml.

on:
  pull_request:
    paths:
      - 'hypervisor/**'
      - 'configs/kernel-oc9.riscv64.config'
      - 'hypervisor/scripts/fetch_guest_assets_riscv64.sh'
      - 'hypervisor/scripts/sha1sums-riscv64'
      - '.github/workflows/riscv64-guest-assets-check.yml'
  workflow_dispatch:

concurrency:
  group: riscv64-guest-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fetch-assets:
    name: Fetch + assemble riscv64 guest assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install qemu-utils + unzip
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-utils unzip

      - name: Fetch riscv64 guest assets (opensbi + rootfs)
        env:
          CUBE_RISCV64_ROOTFS_URL: ${{ vars.CUBE_RISCV64_ROOTFS_URL }}
          WORKLOADS_DIR: ${{ github.workspace }}/workloads
        run: |
          set -euo pipefail
          chmod +x hypervisor/scripts/fetch_guest_assets_riscv64.sh
          hypervisor/scripts/fetch_guest_assets_riscv64.sh

      - name: Upload assembled guest assets
        uses: actions/upload-artifact@v4
        with:
          name: riscv64-guest-assets
          path: |
            workloads/fw_dynamic.bin
            workloads/ubuntu-riscv64.raw
          if-no-files-found: error
          retention-days: 1
