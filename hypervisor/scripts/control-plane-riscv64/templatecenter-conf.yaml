# CubeTemplateCenter config for the riscv64 C1 control-plane demo.
# Derived verbatim from the hand-validated cube-l1 bed
# (bed-cubetoolbox.tgz:CubeTemplateCenter/conf.yaml).
common:
  http_bind: "127.0.0.1"
  http_port: 8090
  http_readtimeout: 600
  http_writetimeout: 3600
  http_idletimeout: 3600
  master_addr: "http://127.0.0.1:8089"

log:
  module: "templatecenter"
  path: "/data/log/CubeTemplateCenter"
  file_size: 100
  file_num: 10
  level: "info"

instance_db_config:
  driver: "mysql"
  addr: "127.0.0.1:3306"
  user: "cube"
  pwd: "cube_pass"
  db_name: "cube_mvp"
  conn_timeout: 120
  read_timeout: 120
  write_timeout: 120
  max_idle_conns: 5
  max_open_conns: 20
  max_conn_life_time_seconds: 300

redis:
  nodes: "127.0.0.1:6379"
  password: "ceuhvu123"
  db_no: 0
  max_idle: 8
  max_active: 32
  idle_timeout: 30
  max_retry: 2

auth:
  enable: false
