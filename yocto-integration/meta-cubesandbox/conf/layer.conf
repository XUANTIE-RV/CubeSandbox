# meta-cubesandbox layer configuration.
# Modeled on meta-xuantie/conf/layer.conf (BBFILE_PRIORITY 6 there); we use 7 so
# this layer can win recipe/version arbitration without editing meta-xuantie.
# Provenance: layer-conf-mgmt skill (scenario D: BBFILE_PRIORITY).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "cubesandbox-layer"
BBFILE_PATTERN_cubesandbox-layer = "^${LAYERDIR}/"
BBFILE_PRIORITY_cubesandbox-layer = "7"

LAYERDEPENDS_cubesandbox-layer = "core"
# meta-clang (clang-native for bpf2go) and meta-virtualization (containerd) are
# expected in bblayers.conf of the xuantie build; keep them soft deps:
# TODO(verify): add "clang-layer virtualization-layer" once tested.
LAYERSERIES_COMPAT_cubesandbox-layer = "langdale"
